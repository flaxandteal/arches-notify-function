[build-system]
requires = ["setuptools>=77", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "arches-notifications"
version = "0.1.0a0"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
authors = []
description = "Config-driven notification functions for Arches projects."
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "arches<8.3.0,>=8.1.0a0",
]

[dependency-groups]
dev = ["pytest", "pytest-django"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools]
packages = ["arches_notifications"]

[tool.setuptools.package-data]
arches_notifications = [
    "templates/**/*",
]
